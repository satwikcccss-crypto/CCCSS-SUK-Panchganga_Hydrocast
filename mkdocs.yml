site_name: HydroCast HEC-HMS Documentation
site_url: https://satwikcccss-crypto.github.io/CCCSS-SUK-Panchganga_Hydrocast/
repo_url: https://github.com/satwikcccss-crypto/CCCSS-SUK-Panchganga_Hydrocast

theme:
  name: material
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.smartsymbols
  - admonition
  - tables
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

copyright: "Developed by Er. Satwik Udupi. Funded by DST-SERB, Government of India. Integrated with Panchganga HydroCast Telegram Bot."

nav:
  - "Overview":
    - "HydroCast Documentation": index.md
    - "Project Background": Project_Background.md
  - "Frontend":
    - "Architecture & Design": Frontend.md
  - "Backend":
    - "Core Backend": Backend.md
    - "Database & ORM": Database.md
    - "Deployment": Deployment_Operations.md
  - "Hydrology":
    - "Runoff Computation": Runoff_Computation.md
    - "HEC-HMS Engine": HMS.md
    - "Hydraulics & River Routing": Hydraulics.md
    - "Stage-Discharge Conversion": Stage_Conversion_Discharge.md
    - "Rating Curve Cross-Check": WRD_Historical_Rating_Curve_CrossCheck.md
  - "Engineering":
    - "System Architecture": Architecture.md
    - "IoT Telemetry": IoT_Telemetry.md
    - "Raingauge Network": Raingauge_Station.md
    - "OpenMeteo Integration": Openmeteo.md
    - "Calibration & Validation": Calibration_Validation.md
    - "Rainfall Validation Pipeline": Rainfall_Validation_Pipeline.md
    - "Errors & Engineering Assumptions": Errors_Mistakes_Engineering_Assumptions.md
    - "System Novelty": Novelty_of_this_System.md
    - "GIS Shapefiles": Shpfiles.md
    - "Future Roadmap": ROADMAP.md

docs_dir: docs_src
site_dir: docs
