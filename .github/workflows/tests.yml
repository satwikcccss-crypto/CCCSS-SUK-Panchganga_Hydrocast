name: HydroCast Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'frontend/public/data/**'
      - 'docs/**'
      - '*.md'
  pull_request:
  workflow_dispatch:

env:
  # Must match the runtime image and the environment the lockfile was validated
  # against (Dockerfile: python:3.12-slim-bookworm).
  PYTHON_VERSION: "3.12"

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: "Unit Tests · Coverage Gate · Type Check · Smoke"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python Dependencies (pinned)
        run: |
          pip install --upgrade pip
          pip install -r requirements.lock
          pip install pytest pytest-cov mypy
          pip install -r requirements-docs.txt

      - name: Production Entry Import Smoke Check
        run: python -c "import src.ecmwf.open_meteo; import src.hms.runner; import src.hydrology.ml_calibration; import src.orchestrator"

      - name: Run Test Suite (coverage-gated)
        # Ratchet: `--cov-fail-under` stops coverage regressing below the current
        # floor (~46%). Raise the number as tests are added.
        run: python -m pytest -q --cov=src --cov-report=term-missing --cov-fail-under=45

      - name: Type Check (advisory)
        # 119 known errors concentrated in dynamic DB/HTTP code. Reported, not
        # blocking, until the backlog is cleared — then drop `continue-on-error`.
        continue-on-error: true
        run: python -m mypy src

  frontend:
    name: "Frontend · Type Check · Build · Playwright Smoke"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install from lockfile
        run: npm ci

      - name: Type Check
        run: npx tsc --noEmit

      - name: Production Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser Smoke Test
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docker:
    name: "Docker · Runtime Image · Health Smoke"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runner
          tags: hydrocast-backend:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: |
          docker run -d --name hydrocast-smoke \
            -e WEB_CONCURRENCY=1 \
            -e REQUIRE_API_KEY=false \
            -p 18000:8000 \
            hydrocast-backend:ci

      - name: Wait for health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18000/api/v1/health; then
              echo "health OK"
              exit 0
            fi
            sleep 2
          done
          echo "health check failed; container logs:"
          docker logs hydrocast-smoke
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f hydrocast-smoke

  postgres:
    name: "Postgres · Orchestrator Write Path"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hydrocast_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hydrocast_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      HYDROCAST_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hydrocast_test

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install pytest psycopg2-binary numpy python-dotenv

      - name: Apply schema and run orchestrator write path
        run: python -m pytest tests/test_postgres_integration.py -q