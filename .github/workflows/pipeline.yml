name: Hydrocast Panchganga Forecast Pipeline

# Automated Forecast Cycle (Runs at 02:30, 08:30, 14:30, 20:30 UTC)
# Pure Cloud Execution: Open-Meteo v1 + Dynamic Station Selector + HEC-HMS 4.13 Simulation + Hydraulic Rating + Supabase DB Write

on:
  schedule:
    - cron: "30 2  * * *"   # 02:30 UTC (06z ECMWF cycle)
    - cron: "30 8  * * *"   # 08:30 UTC (12z ECMWF cycle)
    - cron: "30 14 * * *"   # 14:30 UTC (18z ECMWF cycle)
    - cron: "30 20 * * *"   # 20:30 UTC (00z ECMWF cycle)
  workflow_dispatch:        # Allows manual run from GitHub Actions tab

env:
  PYTHON_VERSION: "3.11"
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  BBOX_N: "17.20"
  BBOX_S: "16.20"
  BBOX_E: "74.50"
  BBOX_W: "73.70"

jobs:
  forecast_pipeline:
    name: "Open-Meteo Fetch, Dynamic Selector & HEC-HMS 4.13 Hydrological Cycle"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Set up Java OpenJDK (for HEC-HMS engine)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install System Dependencies (Headless X11 & GDAL)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgdal-dev libgeos-dev

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compute Forecast Cycle ID
        id: meta
        run: |
          python - <<'EOF'
          import os
          from datetime import datetime, timezone

          now = datetime.now(timezone.utc)
          date_str = now.strftime("%Y%m%d")
          h = now.hour
          time_str = "00z" if h < 6 else "06z" if h < 12 else "12z" if h < 18 else "18z"
          cycle_id = f"CYC_{date_str}_{time_str}"
          
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"cycle_id={cycle_id}\n")
              f.write(f"date={date_str}\n")
              f.write(f"time={time_str}\n")
          print(f"Executing Forecast Cycle: {cycle_id}")
          EOF

      - name: 1. Fetch Open-Meteo 90-hr Forecasts, Run Hydrological Cycle & Sync DB
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          THINGSPEAK_CHANNEL_ID: "3424513"
          THINGSPEAK_API_KEY: "TSUKPZEUN1BXODUF"
        run: |
          python -m src.ecmwf.open_meteo

      - name: 2. Calculate Hydraulic Bridge Stages & Store Rating Curves
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m src.hydrology.stage_converter

      - name: 3. Commit & Push Updated Live Telemetry to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/latest_pipeline_state.json data/openmeteo_dss/
          git diff --staged --quiet || (git commit -m "Auto-update live forecast telemetry cycle [skip ci]" && git push)
