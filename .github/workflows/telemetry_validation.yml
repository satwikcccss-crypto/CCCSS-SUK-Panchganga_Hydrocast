name: ThingSpeak Real-Time Telemetry Validation

# Continuous 90-Hour Hydrograph Verification Pipeline
# Runs every 3 hours to ingest live ThingSpeak ultrasonic radar readings (Shivaji Bridge),
# resamples them into hourly means, matches against the active 90-hour forecast,
# and computes genuine mathematical accuracy metrics (RMSE, MAE, NSE, PBIAS, Spearman rho).

on:
  schedule:
    - cron: "0 * * * *"    # Every 1 hour at minute 0
  workflow_dispatch:        # Manual on-demand execution

env:
  PYTHON_VERSION: "3.11"
  THINGSPEAK_CHANNEL_ID: ${{ secrets.THINGSPEAK_CHANNEL_ID }}
  THINGSPEAK_API_KEY: ${{ secrets.THINGSPEAK_API_KEY }}

jobs:
  validate_telemetry:
    name: "ThingSpeak Live Telemetry vs 90-hr Hydrograph Validation"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Real-Time Validation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.SUPABASE_DB_URL || secrets.SUPABASE_DATABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          THINGSPEAK_CHANNEL_ID: ${{ env.THINGSPEAK_CHANNEL_ID }}
          THINGSPEAK_API_KEY: ${{ env.THINGSPEAK_API_KEY }}
        run: |
          python -m src.hydrology.realtime_telemetry_validator --all-pending

      - name: Commit & Push Verified Telemetry State to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            data/telemetry/thingspeak_hourly_cache.json \
            data/telemetry/ml_calibration_state.json \
            frontend/public/data/latest_pipeline_state.json \
            frontend/public/data/runs_history.json \
            data/runs/runs_index.json 2>/dev/null || true
          git add -u data/runs/ frontend/public/data/runs/ 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "chore(telemetry): update real-time ThingSpeak validation [skip ci]" && git push)
