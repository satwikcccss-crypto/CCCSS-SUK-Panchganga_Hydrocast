<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="100%" height="100%" style="background: #030712; font-family: 'JetBrains Mono', 'Segoe UI', -apple-system, monospace;">
  <defs>
    <!-- CRT Oscilloscope Screen Grid Pattern -->
    <pattern id="crt-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#0e1726" stroke-width="0.7"/>
      <circle cx="0" cy="0" r="1.2" fill="#1e293b"/>
    </pattern>

    <!-- Neon Phosphor Glow Filters -->
    <filter id="neon-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neon-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="beacon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Hydrograph Volume Gradient -->
    <linearGradient id="curve-volumetric" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="85%" stop-color="#0369a1" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#082f49" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Uncertainty Band Gradient -->
    <linearGradient id="band-ribbon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Gauge Bezel Metallic Shading -->
    <linearGradient id="dial-bezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Animations -->
    <style>
      @keyframes sweepScan {
        0% { transform: translateX(0); }
        100% { transform: translateX(180px); }
      }
      @keyframes pulsePoint {
        0%, 100% { r: 5px; filter: drop-shadow(0 0 4px #f59e0b); }
        50% { r: 8px; filter: drop-shadow(0 0 12px #fbbf24); }
      }
      @keyframes beaconFlash {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.85); }
      }
      @keyframes spinTick {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .scan-cursor { animation: sweepScan 10s ease-in-out infinite alternate; }
      .glowing-node { animation: pulsePoint 1.8s infinite; }
      .hazard-beacon { animation: beaconFlash 1s infinite alternate; transform-origin: center; }
      .dial-spinner { transform-origin: 50px 50px; animation: spinTick 8s linear infinite; }
    </style>
  </defs>

  <!-- Background Chassis -->
  <rect width="1200" height="640" fill="#030712"/>
  <rect width="1200" height="640" fill="url(#crt-grid)"/>

  <!-- Outer Frame -->
  <rect x="16" y="16" width="1168" height="608" rx="6" fill="none" stroke="#1f2937" stroke-width="1.5"/>

  <!-- Top Title & Mode Bar -->
  <g transform="translate(32, 28)">
    <rect width="1136" height="36" rx="4" fill="#090d16" stroke="#1e293b" stroke-width="1.2"/>
    <circle cx="16" cy="18" r="4.5" fill="#10b981" class="hazard-beacon"/>
    <text x="28" y="22" fill="#38bdf8" font-size="11" font-weight="900" letter-spacing="1.5">90-HOUR HYDROGRAPH // DIGITAL TWIN OSCILLOSCOPE</text>
    <text x="780" y="22" fill="#94a3b8" font-size="9.5">SIMULATION HORIZON: 90 HOURS · DISCRETE HOURLY STEP VERIFICATION</text>
    <text x="1120" y="22" fill="#10b981" font-size="9" font-weight="800" text-anchor="end">SYNC: LIVE</text>
  </g>

  <!-- ==================== RIGHT SIDE: 4 CIRCULAR GRAPHICAL INSTRUMENT DIALS ==================== -->
  <g transform="translate(930, 80)">

    <!-- DIAL 1: NASH-SUTCLIFFE EFFICIENCY (NSE = 0.88) -->
    <g transform="translate(0, 0)">
      <!-- Bezel -->
      <circle cx="115" cy="54" r="50" fill="url(#dial-bezel)" stroke="#334155" stroke-width="2"/>
      <circle cx="115" cy="54" r="43" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>
      
      <!-- Background Arc -->
      <path d="M 85 78 A 36 36 0 1 1 145 78" fill="none" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
      <!-- Active NSE Arc (0 to 0.88) -->
      <path d="M 85 78 A 36 36 0 1 1 140 40" fill="none" stroke="#6366f1" stroke-width="5" stroke-linecap="round" filter="url(#neon-cyan)"/>
      
      <!-- Center Readout -->
      <text x="115" y="52" fill="#f8fafc" font-size="14" font-weight="900" text-anchor="middle">0.88</text>
      <text x="115" y="66" fill="#818cf8" font-size="8.5" font-weight="800" text-anchor="middle">NSE INDEX</text>
      <rect x="75" y="74" width="80" height="14" rx="2" fill="#1e1b4b" stroke="#6366f1" stroke-width="0.8"/>
      <text x="115" y="84.5" fill="#a5b4fc" font-size="7.5" font-weight="800" text-anchor="middle">VERY GOOD FIT</text>
    </g>

    <!-- DIAL 2: DETERMINATION COEFFICIENT (R² = 0.91) -->
    <g transform="translate(0, 125)">
      <circle cx="115" cy="54" r="50" fill="url(#dial-bezel)" stroke="#334155" stroke-width="2"/>
      <circle cx="115" cy="54" r="43" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>

      <!-- Arc -->
      <path d="M 85 78 A 36 36 0 1 1 145 78" fill="none" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
      <path d="M 85 78 A 36 36 0 1 1 143 45" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" filter="url(#neon-cyan)"/>

      <text x="115" y="52" fill="#f8fafc" font-size="14" font-weight="900" text-anchor="middle">0.91</text>
      <text x="115" y="66" fill="#38bdf8" font-size="8.5" font-weight="800" text-anchor="middle">PEARSON R²</text>
      <rect x="75" y="74" width="80" height="14" rx="2" fill="#082f49" stroke="#38bdf8" stroke-width="0.8"/>
      <text x="115" y="84.5" fill="#7dd3fc" font-size="7.5" font-weight="800" text-anchor="middle">91% VARIANCE</text>
    </g>

    <!-- DIAL 3: PEAK DISCHARGE TACHOMETER (544.4 m³/s) -->
    <g transform="translate(0, 250)">
      <circle cx="115" cy="54" r="50" fill="url(#dial-bezel)" stroke="#334155" stroke-width="2"/>
      <circle cx="115" cy="54" r="43" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>

      <!-- Gauge Arc (Safe Green to Danger Red) -->
      <path d="M 85 78 A 36 36 0 0 1 115 18" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>
      <path d="M 115 18 A 36 36 0 0 1 145 78" fill="none" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>

      <!-- Needle (Pointing to 544 m³/s) -->
      <g transform="rotate(-30 115 54)">
        <polygon points="113,54 117,54 115,22" fill="#38bdf8"/>
        <circle cx="115" cy="54" r="4" fill="#ffffff"/>
      </g>

      <text x="115" y="68" fill="#f8fafc" font-size="11" font-weight="900" text-anchor="middle">544.4 m³/s</text>
      <text x="115" y="80" fill="#34d399" font-size="7.5" font-weight="800" text-anchor="middle">PEAK FLOW (T+32h)</text>
    </g>

    <!-- DIAL 4: 90h LIFECYCLE PROGRESS DONUT (18 / 90h = 20%) -->
    <g transform="translate(0, 375)">
      <circle cx="115" cy="54" r="50" fill="url(#dial-bezel)" stroke="#334155" stroke-width="2"/>
      <circle cx="115" cy="54" r="43" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>

      <!-- Donut Track -->
      <circle cx="115" cy="54" r="34" fill="none" stroke="#1e293b" stroke-width="6"/>
      <!-- 20% Circumference = 0.20 * 2 * pi * 34 ≈ 42.7px -->
      <circle cx="115" cy="54" r="34" fill="none" stroke="#10b981" stroke-width="6" stroke-dasharray="43 171" stroke-dashoffset="53" stroke-linecap="round" filter="url(#neon-cyan)"/>

      <text x="115" y="52" fill="#10b981" font-size="13" font-weight="900" text-anchor="middle">18 / 90h</text>
      <text x="115" y="65" fill="#94a3b8" font-size="8" font-weight="700" text-anchor="middle">20% VERIFIED</text>
      <circle cx="115" cy="76" r="3" fill="#10b981" class="hazard-beacon"/>
    </g>
  </g>

  <!-- ==================== MAIN GRAPHICAL OSCILLOSCOPE DISPLAY ==================== -->
  <g transform="translate(80, 80)">
    <!-- Scope Screen Viewport (Width 810, Height 490) -->
    <rect width="810" height="490" rx="6" fill="#040814" stroke="#1e293b" stroke-width="1.5"/>

    <!-- FLOOD HAZARD THRESHOLD BANDS (Visual Colored Zones) -->
    <!-- Danger Band (543.30m, y = 55) -->
    <rect x="0" y="0" width="810" height="55" fill="#ef4444" fill-opacity="0.12"/>
    <line x1="0" y1="55" x2="810" y2="55" stroke="#ef4444" stroke-width="2" stroke-dasharray="8 4"/>
    <circle cx="30" cy="55" r="5" fill="#ef4444" class="hazard-beacon" filter="url(#beacon-glow)"/>
    <text x="45" y="50" fill="#ef4444" font-size="9" font-weight="900">DANGER LEVEL 543.30 m MSL (Q = 2,675 m³/s)</text>

    <!-- Warning Band (542.70m, y = 85) -->
    <line x1="0" y1="85" x2="810" y2="85" stroke="#f97316" stroke-width="1.6" stroke-dasharray="6 3"/>
    <circle cx="30" cy="85" r="4.5" fill="#f97316"/>
    <text x="45" y="80" fill="#f97316" font-size="8.5" font-weight="800">WARNING LEVEL 542.70 m MSL (Q = 2,200 m³/s)</text>

    <!-- Alert Band (542.10m, y = 115) -->
    <line x1="0" y1="115" x2="810" y2="115" stroke="#eab308" stroke-width="1.6" stroke-dasharray="5 3"/>
    <circle cx="30" cy="115" r="4" fill="#eab308"/>
    <text x="45" y="110" fill="#eab308" font-size="8.5" font-weight="800">ALERT LEVEL 542.10 m MSL (Q = 1,800 m³/s)</text>

    <!-- Major Elevation Reference Lines -->
    <line x1="0" y1="200" x2="810" y2="200" stroke="#1e293b" stroke-width="0.8"/>
    <line x1="0" y1="285" x2="810" y2="285" stroke="#1e293b" stroke-width="0.8"/>
    <line x1="0" y1="370" x2="810" y2="370" stroke="#1e293b" stroke-width="0.8"/>

    <!-- Vertical Time Grid Steps (9h intervals = 81px) -->
    <g stroke="#0f172a" stroke-width="0.8" stroke-dasharray="4 4">
      <line x1="81" y1="0" x2="81" y2="490"/>
      <line x1="162" y1="0" x2="162" y2="490"/>
      <line x1="243" y1="0" x2="243" y2="490"/>
      <line x1="324" y1="0" x2="324" y2="490"/>
      <line x1="405" y1="0" x2="405" y2="490"/>
      <line x1="486" y1="0" x2="486" y2="490"/>
      <line x1="567" y1="0" x2="567" y2="490"/>
      <line x1="648" y1="0" x2="648" y2="490"/>
      <line x1="729" y1="0" x2="729" y2="490"/>
    </g>

    <!-- 1. VERIFIED TELEMETRY REGION GRAPHIC (T+0 to T+18h = 162px) -->
    <rect x="0" y="0" width="162" height="490" fill="#10b981" fill-opacity="0.05"/>
    <line x1="162" y1="0" x2="162" y2="490" stroke="#10b981" stroke-width="2" stroke-dasharray="4 3"/>
    
    <!-- Verified Badge with Radar Antenna Icon -->
    <g transform="translate(162, 18)">
      <rect x="-140" y="0" width="135" height="22" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <circle cx="-125" cy="11" r="3.5" fill="#10b981" class="hazard-beacon"/>
      <text x="-115" y="15" fill="#a7f3d0" font-size="8.5" font-weight="900">VERIFIED RADAR WINDOW</text>
    </g>

    <!-- 2. PREDICTED UNCERTAINTY CONFIDENCE ENVELOPE (Ribbon Area) -->
    <path d="M 0 405 
             C 80 402, 150 388, 220 345 
             C 265 315, 280 290, 288 290 
             C 310 290, 380 325, 460 365 
             C 550 400, 680 415, 810 422 
             L 810 440 
             C 680 432, 550 415, 460 380 
             C 380 342, 310 310, 288 310 
             C 280 310, 265 335, 220 365 
             C 150 408, 80 420, 0 422 Z" 
          fill="url(#band-ribbon)"/>

    <!-- 3. MAIN PREDICTED HYDROGRAPH CURVE (Volumetric Shading + Glow Trace) -->
    <path d="M 0 413 
             C 80 410, 150 398, 220 355 
             C 265 328, 280 300, 288 300 
             C 310 300, 380 335, 460 372 
             C 550 408, 680 422, 810 428 
             L 810 490 L 0 490 Z" 
          fill="url(#curve-volumetric)"/>

    <!-- Primary Neon Blue Predicted Hydrograph Trace Line -->
    <path d="M 0 413 
             C 80 410, 150 398, 220 355 
             C 265 328, 280 300, 288 300 
             C 310 300, 380 335, 460 372 
             C 550 408, 680 422, 810 428" 
          fill="none" stroke="#38bdf8" stroke-width="3.5" filter="url(#neon-cyan)"/>

    <!-- Predicted Peak Graphical Flag at T+32h (x = 288, y = 300 -> 535.84 m MSL) -->
    <g transform="translate(288, 300)">
      <circle cx="0" cy="0" r="7" fill="#38bdf8" stroke="#ffffff" stroke-width="2" filter="url(#beacon-glow)"/>
      <line x1="0" y1="0" x2="0" y2="-75" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="3 2"/>
      
      <!-- Flag Shield -->
      <polygon points="0,-75 140,-75 125,-55 140,-35 0,-35" fill="#082f49" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="12" y="-59" fill="#7dd3fc" font-size="8.5" font-weight="900">PREDICTED PEAK</text>
      <text x="12" y="-44" fill="#ffffff" font-size="11" font-weight="900">535.84 m · 544.4 m³/s</text>
    </g>

    <!-- 4. ACTUAL OBSERVED TELEMETRY STEMS & GLOWING BEADS (ThingSpeak) -->
    <!-- Continuous line through measured points (T+0 to T+18) -->
    <path d="M 0 414 L 9 415 L 18 413 L 27 411 L 36 415 L 45 414 L 54 412 L 63 416 L 72 415 L 81 411 L 90 412 L 99 410 L 108 411 L 117 409 L 126 408 L 135 407 L 144 406 L 153 405 L 162 405" 
          fill="none" stroke="#f59e0b" stroke-width="2.8" filter="url(#neon-amber)"/>

    <!-- Amber Glowing Measurement Beads -->
    <g fill="#fbbf24" stroke="#78350f" stroke-width="1.2">
      <circle cx="0" cy="414" r="4"/><circle cx="9" cy="415" r="4"/>
      <circle cx="18" cy="413" r="4"/><circle cx="27" cy="411" r="4"/>
      <circle cx="36" cy="415" r="4"/><circle cx="45" cy="414" r="4"/>
      <circle cx="54" cy="412" r="4"/><circle cx="63" cy="416" r="4"/>
      <circle cx="72" cy="415" r="4"/><circle cx="81" cy="411" r="4"/>
      <circle cx="90" cy="412" r="4"/><circle cx="99" cy="410" r="4"/>
      <circle cx="108" cy="411" r="4"/><circle cx="117" cy="409" r="4"/>
      <circle cx="126" cy="408" r="4"/><circle cx="135" cy="407" r="4"/>
      <circle cx="144" cy="406" r="4"/><circle cx="153" cy="405" r="4"/>
      <!-- Latest Active Telemetry Node (T+18h) -->
      <circle cx="162" cy="405" r="7" class="glowing-node"/>
    </g>

    <!-- Latest Reading Callout Shield -->
    <g transform="translate(162, 405)">
      <line x1="0" y1="0" x2="35" y2="30" stroke="#f59e0b" stroke-width="1.5"/>
      <rect x="35" y="15" width="165" height="42" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="44" y="29" fill="#f59e0b" font-size="8.5" font-weight="900">RADAR MEASURED (T+18h)</text>
      <text x="44" y="44" fill="#ffffff" font-size="11" font-weight="900">533.20 m (52.95 ft)</text>
      <circle cx="188" cy="27" r="3" fill="#10b981"/>
    </g>

    <!-- TIME HORIZON X-AXIS GRADUATION -->
    <g transform="translate(0, 505)" fill="#94a3b8" font-size="9" text-anchor="middle">
      <text x="0">T+0h</text>
      <text x="81">T+9h</text>
      <text x="162" fill="#10b981" font-weight="900">T+18h [NOW]</text>
      <text x="243">T+27h</text>
      <text x="324" fill="#38bdf8" font-weight="900">T+36h [PEAK]</text>
      <text x="405">T+45h</text>
      <text x="486">T+54h</text>
      <text x="567">T+63h</text>
      <text x="648">T+72h</text>
      <text x="729">T+81h</text>
      <text x="810">T+90h</text>
      <text x="405" y="18" fill="#cbd5e1" font-size="10" font-weight="800">FORECAST LEAD TIME HORIZON (HOURS AHEAD)</text>
    </g>
  </g>

  <!-- Left Y-Axis Elevation Markers -->
  <g transform="translate(70, 80)" fill="#38bdf8" font-size="9" text-anchor="end">
    <text x="0" y="58" fill="#ef4444" font-weight="900">543.3m</text>
    <text x="0" y="88" fill="#f97316" font-weight="900">542.7m</text>
    <text x="0" y="118" fill="#eab308" font-weight="900">542.1m</text>
    <text x="0" y="204">540.0m</text>
    <text x="0" y="289">537.5m</text>
    <text x="0" y="304" fill="#38bdf8" font-weight="900">535.8m</text>
    <text x="0" y="374">535.0m</text>
    <text x="0" y="410" fill="#fbbf24" font-weight="900">533.2m</text>
    <text x="0" y="490">530.2m</text>

    <text x="-245" y="-45" transform="rotate(-90)" fill="#38bdf8" font-size="10" font-weight="900" text-anchor="middle">WATER STAGE (METERS GTS MSL)</text>
  </g>
</svg>
