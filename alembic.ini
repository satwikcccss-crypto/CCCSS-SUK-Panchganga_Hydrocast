# HydroCast Alembic Configuration
[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration files
# template = generic

# version location
version_locations = %(here)s/versions

# source of sqlalchemy.url setting
sqlalchemy.url = ${DATABASE_URL}

# logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S