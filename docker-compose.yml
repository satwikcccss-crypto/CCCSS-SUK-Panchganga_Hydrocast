# =============================================================================
# HydroCast Panchganga — Docker Compose for Containerized Testing
# Target: Shivaji University Kolhapur (SUK)
#
# Usage:
#   docker compose up -d          # Start backend + PostgreSQL
#   docker compose up -d backend  # Start backend only (degrades gracefully)
# =============================================================================

services:
  # ── PostgreSQL 16 + PostGIS (optional; backend degrades without it) ──
  db:
    image: postgis/postgis:16-3.4
    container_name: hydrocast-db
    environment:
      POSTGRES_DB: rainfall_runoff
      POSTGRES_USER: hms_app
      POSTGRES_PASSWORD: hms_secret_2026
    ports:
      - "5432:5432"
    volumes:
      - hydrocast_db_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seeds.sql:/docker-entrypoint-initdb.d/02-seeds.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hms_app -d rainfall_runoff"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Backend FastAPI (Port 8000) ──
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: hydrocast-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://hms_app:hms_secret_2026@db:5432/rainfall_runoff
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend Next.js Public Portal (Port 3000) ──
  frontend:
    build:
      context: ./frontend-public
      dockerfile: Dockerfile
    container_name: hydrocast-frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
      NEXT_PUBLIC_WS_URL: ws://backend:8000/ws/live
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  hydrocast_db_data:

networks:
  default:
    name: hydrocast-net
