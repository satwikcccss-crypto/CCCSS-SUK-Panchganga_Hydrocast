# =============================================================================
# HydroCast Panchganga — Docker Compose (Production)
# =============================================================================
# Usage:
#   docker compose up -d              # Start all services
#   docker compose up -d backend      # Start backend + DB only
#   docker compose logs -f backend    # Follow backend logs
# =============================================================================

services:
  # ── PostgreSQL 16 + PostGIS ──
  # NOTE: DB is NOT exposed to the host (no ports mapping). All credentials
  # must be supplied via .env (never committed). Postgres requires
  # POSTGRES_PASSWORD; set it in .env before first deploy.
  db:
    image: postgis/postgis:16-3.4
    container_name: hydrocast-db
    environment:
      POSTGRES_DB: rainfall_runoff
      POSTGRES_USER: hydrocast
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - hydrocast_db_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seeds.sql:/docker-entrypoint-initdb.d/02-seeds.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydrocast -d rainfall_runoff"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1.0
    user: "999:999"
    security_opt:
      - no-new-privileges:true

  # ── Backend Public API (Port 8000) ──
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: hydrocast-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # DATABASE_URL is supplied via .env (never committed).
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001,http://frontend:3000,http://frontend-admin:3001
    secrets:
      - postgres_password
      - api_key
      - jwt_secret
      - admin_password
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 1.5g
    cpus: 1.0
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Backend Admin API (Port 8001) ──
  backend-admin:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: hydrocast-backend-admin
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      # DATABASE_URL is supplied via .env (never committed).
      ADMIN_CORS_ORIGINS: http://localhost:3001,http://frontend-admin:3001,http://localhost:3000,http://frontend:3000
    secrets:
      - postgres_password
      - api_key
      - jwt_secret
      - admin_password
    command: ["uvicorn", "backend.api.admin_app:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "2"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 1g
    cpus: 0.5
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/v1/admin/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Frontend Public Dashboard (Port 3000) ──
  frontend:
    build:
      context: ./frontend-public
    container_name: hydrocast-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
      NEXT_PUBLIC_WS_URL: ws://backend:8000/ws/live
    depends_on:
      - backend
    restart: unless-stopped
    mem_limit: 1g
    cpus: 0.5
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Frontend Admin Console (Port 3001) ──
  frontend-admin:
    build:
      context: ./frontend-admin
    container_name: hydrocast-frontend-admin
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
      NEXT_PUBLIC_ADMIN_API_URL: http://backend-admin:8001
      NEXT_PUBLIC_WS_URL: ws://backend:8000/ws/live
      NEXT_PUBLIC_ADMIN_WS_URL: ws://backend-admin:8001/ws/admin/telemetry
      PORT: "3001"
    depends_on:
      - backend
      - backend-admin
    restart: unless-stopped
    mem_limit: 1g
    cpus: 0.5
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3001/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  hydrocast_db_data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  api_key:
    file: ./secrets/api_key.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  admin_password:
    file: ./secrets/admin_password.txt

networks:
  default:
    name: hydrocast-net
