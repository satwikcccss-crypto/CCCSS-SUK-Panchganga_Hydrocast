<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 130" width="860" height="130" role="img" aria-label="HydroCast tech stack strip">
  <defs>
    <linearGradient id="bgT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glowT"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip4"><rect width="860" height="130" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#clip4)">
    <rect width="860" height="130" fill="url(#bgT)" rx="14"/>

    <text x="430" y="20" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="600"
          fill="#64748b" text-anchor="middle" letter-spacing="3">TECHNOLOGY STACK</text>

    <!-- Tech items — each with hover-like pulse -->
    <!-- Python -->
    <g transform="translate(55, 70)">
      <circle r="28" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
      <text font-family="'Segoe UI', system-ui, sans-serif" font-size="22" text-anchor="middle" y="-4" fill="white">🐍</text>
      <text font-family="'Segoe UI', system-ui, sans-serif" font-size="8" font-weight="600" fill="#93c5fd" text-anchor="middle" y="14">Python 3.12</text>
      <circle r="32" fill="none" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.3">
        <animate attributeName="r" values="28;36;28" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0;0.3" dur="3s" repeatCount="indefinite"/>
      </circle>
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.0s" fill="freeze"/>
    </g>

    <!-- FastAPI -->
    <g transform="translate(165, 70)">
      <circle r="28" fill="#1e293b" stroke="#059669" stroke-width="1.5"/>
      <text font-family="'Segoe UI', system-ui, sans-serif" font-size="22" text-anchor="middle" y="-4" fill="white">⚡</text>
      <text font-family="'Segoe UI', system-ui, sans-serif" font-size="8" font-weight="600" fill="#6ee7b7" text-anchor="middle" y="14">FastAPI</text>
      <circle r="32" fill="none" stroke="#059669" stroke-width="1" stroke-opacity="0.3">
        <animate attributeName="r" values="28;36;28" dur="3.3s" begin="0.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0;0.3" dur="3.3s" begin="0.2s" repeatCount="indefinite"/>
      </circle>
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.1s" fill="freeze"/>
    </g>

    <!-- Next.js -->
    <g transform="translate(275, 70)">
      <circle r="28" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
      <text font-family="'Segoe UI', system-ui, sans-serif" font-size="22" text-anchor="middle" y="-4" fill="white">▲</text>
      <text font-family="'Segoe UI', system-ui, sans-serif" font-size="8" font-weight="600" fill="#a5b4fc" text-anchor="middle" y="14">Next.js 14</text>
      <circle r="32" fill="none" stroke="#6366f1" stroke-width="1" stroke-opacity="0.3">
        <animate attributeName="r" values="28;36;28" dur="3.6s" begin="0.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0;0.3" dur="3.6s" begin="0.4s" repeatCount="indefinite"/>
      </circle>
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.2s" fill="freeze"/>
    </g>

    <!-- PostgreSQL -->
    <g transform="translate(385, 70)">
      <circle r="28" fill="#1e293b" stroke="#0369a1" stroke-width="1.5"/>
      <text font-family="'Segoe UI', system-ui, sans-serif" font-size="22" text-anchor="middle" y="-4" fill="white">🐘</text>
      <text font-family="'Segoe UI', system-ui, sans-serif" font-size="8" font-weight="600" fill="#7dd3fc" text-anchor="middle" y="14">PostgreSQL 16</text>
      <circle r="32" fill="none" stroke="#0369a1" stroke-width="1" stroke-opacity="0.3">
        <animate attributeName="r" values="28;36;28" dur="3.9s" begin="0.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0;0.3" dur="3.9s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.3s" fill="freeze"/>
    </g>

    <!-- HEC-HMS -->
    <g transform="translate(495, 70)">
      <circle r="28" fill="#1e293b" stroke="#7c3aed" stroke-width="1.5"/>
      <text font-family="'Segoe UI', system-ui, sans-serif" font-size="22" text-anchor="middle" y="-4" fill="white">🌊</text>
      <text font-family="'Segoe UI', system-ui, sans-serif" font-size="8" font-weight="600" fill="#c4b5fd" text-anchor="middle" y="14">HEC-HMS 4.13</text>
      <circle r="32" fill="none" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.3">
        <animate attributeName="r" values="28;36;28" dur="4.2s" begin="0.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0;0.3" dur="4.2s" begin="0.8s" repeatCount="indefinite"/>
      </circle>
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.4s" fill="freeze"/>
    </g>

    <!-- Docker -->
    <g transform="translate(605, 70)">
      <circle r="28" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5"/>
      <text font-family="'Segoe UI', system-ui, sans-serif" font-size="22" text-anchor="middle" y="-4" fill="white">🐳</text>
      <text font-family="'Segoe UI', system-ui, sans-serif" font-size="8" font-weight="600" fill="#38bdf8" text-anchor="middle" y="14">Docker</text>
      <circle r="32" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.3">
        <animate attributeName="r" values="28;36;28" dur="4.5s" begin="1.0s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0;0.3" dur="4.5s" begin="1.0s" repeatCount="indefinite"/>
      </circle>
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.5s" fill="freeze"/>
    </g>

    <!-- ECMWF -->
    <g transform="translate(715, 70)">
      <circle r="28" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
      <text font-family="'Segoe UI', system-ui, sans-serif" font-size="22" text-anchor="middle" y="-4" fill="white">🛰</text>
      <text font-family="'Segoe UI', system-ui, sans-serif" font-size="8" font-weight="600" fill="#fcd34d" text-anchor="middle" y="14">ECMWF IFS</text>
      <circle r="32" fill="none" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.3">
        <animate attributeName="r" values="28;36;28" dur="4.8s" begin="1.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0;0.3" dur="4.8s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.6s" fill="freeze"/>
    </g>

    <!-- PostGIS -->
    <g transform="translate(805, 70)">
      <circle r="22" fill="#1e293b" stroke="#dc2626" stroke-width="1.5"/>
      <text font-family="'Segoe UI', system-ui, sans-serif" font-size="17" text-anchor="middle" y="-3" fill="white">🗺</text>
      <text font-family="'Segoe UI', system-ui, sans-serif" font-size="7" font-weight="600" fill="#fca5a5" text-anchor="middle" y="13">PostGIS</text>
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.7s" fill="freeze"/>
    </g>

    <!-- Connecting line -->
    <line x1="83" y1="70" x2="777" y2="70" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="3,6"/>

    <rect width="860" height="130" rx="14" fill="none" stroke="#334155" stroke-width="1.5"/>
  </g>
</svg>
