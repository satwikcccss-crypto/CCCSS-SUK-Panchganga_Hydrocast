<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 185" width="900" height="185"
     role="img" aria-label="HydroCast live gauge status: Rajaram Weir at danger level 9.47m, Shivaji Bridge at warning 7.23m, Dhamani at normal 3.81m, 72-hour peak forecast 1247 cubic metres per second">

  <title>HydroCast — Live Gauge Status Dashboard</title>

  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Water fill gradients per level -->
    <linearGradient id="dangerWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ef4444" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="warnWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="normWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#10b981" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="foreWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#6366f1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.6"/>
    </linearGradient>

    <filter id="gf3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sf3" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Clip paths for water fill bars -->
    <clipPath id="dBar"><rect x="0" y="0" width="168" height="12" rx="6"/></clipPath>
    <clipPath id="wBar"><rect x="0" y="0" width="168" height="12" rx="6"/></clipPath>
    <clipPath id="nBar"><rect x="0" y="0" width="168" height="12" rx="6"/></clipPath>
    <clipPath id="fBar"><rect x="0" y="0" width="168" height="12" rx="6"/></clipPath>

    <clipPath id="mainClip"><rect width="900" height="185" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#mainClip)">
    <rect width="900" height="185" fill="url(#bg3)"/>

    <!-- Header -->
    <text x="390" y="22" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="600"
          fill="#475569" text-anchor="middle" letter-spacing="4">LIVE GAUGE STATUS — PANCHGANGA BASIN</text>

    <!-- LIVE dot -->
    <circle cx="818" cy="18" r="5" fill="#ef4444">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="818" cy="18" r="10" fill="none" stroke="#ef4444" stroke-width="1.2">
      <animate attributeName="r"       values="6;14;6" dur="1.0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="1.0s" repeatCount="indefinite"/>
    </circle>
    <text x="834" y="23" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="800"
          fill="#ef4444" letter-spacing="1">LIVE</text>

    <!-- ═══════════════════════════════════════
         CARD 1 — Rajaram Weir (DANGER)
    ═══════════════════════════════════════ -->
    <g transform="translate(18, 35)">
      <!-- Card body -->
      <rect width="195" height="135" rx="12" fill="#1a0a0a" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.8"/>
      <!-- Danger flash border -->
      <rect width="195" height="135" rx="12" fill="none" stroke="#ef4444" stroke-width="3" stroke-opacity="0">
        <animate attributeName="stroke-opacity" values="0;0.4;0;0.4;0" dur="2s" repeatCount="indefinite"/>
      </rect>

      <!-- Alert header bar -->
      <rect width="195" height="30" rx="12" fill="#991b1b"/>
      <rect y="18" width="195" height="12" fill="#991b1b"/>
      <text x="97" y="19" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="800"
            fill="white" text-anchor="middle" letter-spacing="1">🚨 DANGER LEVEL</text>

      <!-- Station name -->
      <text x="97" y="47" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="600"
            fill="#6b7280" text-anchor="middle" letter-spacing="0.5">Rajaram Weir, Kolhapur</text>

      <!-- Level reading (big, glowing, pulsing) -->
      <text x="97" y="82" font-family="'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="900"
            fill="#f87171" text-anchor="middle" filter="url(#gf3)">9.47
        <animate attributeName="opacity" values="1;0.65;1" dur="1.8s" repeatCount="indefinite"/>
      </text>
      <text x="97" y="97" font-family="'Segoe UI', system-ui, sans-serif" font-size="8.5" fill="#6b7280" text-anchor="middle">
        metres above datum
      </text>
      <text x="97" y="110" font-family="'Segoe UI', system-ui, sans-serif" font-size="7.5" fill="#9ca3af" text-anchor="middle">
        Danger: 8.50 m  ·  Warning: 7.00 m
      </text>

      <!-- Water fill bar -->
      <rect x="13" y="120" width="168" height="12" rx="6" fill="#2d1515"/>
      <!-- Danger fill (97% full) -->
      <g clip-path="url(#dBar)" transform="translate(13,120)">
        <rect width="163" height="12" rx="6" fill="url(#dangerWater)">
          <!-- Animated wave on surface -->
          <animate attributeName="width" values="155;163;155" dur="2.5s" repeatCount="indefinite"/>
        </rect>
        <!-- Foam highlight -->
        <rect x="150" y="1" width="13" height="4" rx="2" fill="white" opacity="0.4">
          <animate attributeName="x" values="148;152;148" dur="2.5s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <!-- ═══════════════════════════════════════
         CARD 2 — Shivaji Bridge (WARNING)
    ═══════════════════════════════════════ -->
    <g transform="translate(233, 35)">
      <rect width="195" height="135" rx="12" fill="#1a1200" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.8"/>

      <rect width="195" height="30" rx="12" fill="#92400e"/>
      <rect y="18" width="195" height="12" fill="#92400e"/>
      <text x="97" y="19" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="800"
            fill="white" text-anchor="middle" letter-spacing="1">⚠ WARNING LEVEL</text>

      <text x="97" y="47" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="600"
            fill="#6b7280" text-anchor="middle" letter-spacing="0.5">Shivaji Bridge, Kolhapur</text>

      <text x="97" y="82" font-family="'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="900"
            fill="#fbbf24" text-anchor="middle" filter="url(#gf3)">7.23
        <animate attributeName="opacity" values="1;0.75;1" dur="2.5s" repeatCount="indefinite"/>
      </text>
      <text x="97" y="97" font-family="'Segoe UI', system-ui, sans-serif" font-size="8.5" fill="#6b7280" text-anchor="middle">metres above datum</text>
      <text x="97" y="110" font-family="'Segoe UI', system-ui, sans-serif" font-size="7.5" fill="#9ca3af" text-anchor="middle">Warning: 7.00 m  ·  Danger: 8.50 m</text>

      <rect x="13" y="120" width="168" height="12" rx="6" fill="#1f1500"/>
      <g clip-path="url(#wBar)" transform="translate(13,120)">
        <rect width="72" height="12" rx="6" fill="url(#warnWater)">
          <animate attributeName="width" values="68;75;68" dur="3s" repeatCount="indefinite"/>
        </rect>
        <rect x="60" y="1" width="10" height="4" rx="2" fill="white" opacity="0.4">
          <animate attributeName="x" values="58;63;58" dur="3s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <!-- ═══════════════════════════════════════
         CARD 3 — Dhamani Bridge (NORMAL)
    ═══════════════════════════════════════ -->
    <g transform="translate(448, 35)">
      <rect width="195" height="135" rx="12" fill="#001a0d" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.6"/>

      <rect width="195" height="30" rx="12" fill="#065f46"/>
      <rect y="18" width="195" height="12" fill="#065f46"/>
      <text x="97" y="19" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="800"
            fill="white" text-anchor="middle" letter-spacing="1">✅ NORMAL</text>

      <text x="97" y="47" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="600"
            fill="#6b7280" text-anchor="middle" letter-spacing="0.5">Dhamani Bridge, Panhala</text>

      <text x="97" y="82" font-family="'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="900"
            fill="#34d399" text-anchor="middle" filter="url(#sf3)">3.81</text>
      <text x="97" y="97" font-family="'Segoe UI', system-ui, sans-serif" font-size="8.5" fill="#6b7280" text-anchor="middle">metres above datum</text>
      <text x="97" y="110" font-family="'Segoe UI', system-ui, sans-serif" font-size="7.5" fill="#9ca3af" text-anchor="middle">Warning: 5.50 m  ·  Danger: 7.00 m</text>

      <rect x="13" y="120" width="168" height="12" rx="6" fill="#001f0d"/>
      <g clip-path="url(#nBar)" transform="translate(13,120)">
        <rect width="52" height="12" rx="6" fill="url(#normWater)">
          <animate attributeName="width" values="49;54;49" dur="3.5s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <!-- ═══════════════════════════════════════
         CARD 4 — 72h Forecast
    ═══════════════════════════════════════ -->
    <g transform="translate(663, 35)">
      <rect width="219" height="135" rx="12" fill="#06061a" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.7"/>

      <rect width="219" height="30" rx="12" fill="#312e81"/>
      <rect y="18" width="219" height="12" fill="#312e81"/>
      <text x="109" y="19" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="800"
            fill="white" text-anchor="middle" letter-spacing="1">📡 72h PEAK FORECAST</text>

      <text x="109" y="47" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="600"
            fill="#6b7280" text-anchor="middle" letter-spacing="0.5">ECMWF IFS HRES · HEC-HMS 4.13</text>

      <!-- Peak discharge value -->
      <text x="109" y="78" font-family="'Segoe UI', system-ui, sans-serif" font-size="30" font-weight="900"
            fill="#818cf8" text-anchor="middle" filter="url(#gf3)">1,247
        <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite"/>
      </text>
      <text x="109" y="93" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" fill="#6366f1" text-anchor="middle" font-weight="600">m³/s</text>
      <text x="109" y="108" font-family="'Segoe UI', system-ui, sans-serif" font-size="7.5" fill="#9ca3af" text-anchor="middle">Rajaram Weir · Peak in ~38h</text>

      <!-- Animated forecast wave chart (mini sparkline) -->
      <path d="M13,128 Q35,124 50,126 Q65,122 80,118 Q95,113 110,110 Q125,113 140,116 Q155,122 175,126 L192,128"
            fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" opacity="0.7">
        <animate attributeName="d"
          values="M13,128 Q35,124 50,126 Q65,122 80,118 Q95,113 110,110 Q125,113 140,116 Q155,122 175,126 L192,128;
                  M13,128 Q35,125 50,127 Q65,120 80,116 Q95,110 110,108 Q125,112 140,118 Q155,124 175,127 L192,128;
                  M13,128 Q35,124 50,126 Q65,122 80,118 Q95,113 110,110 Q125,113 140,116 Q155,122 175,126 L192,128"
          dur="4s" repeatCount="indefinite"/>
      </path>
      <!-- Filled area under chart -->
      <path d="M13,128 Q35,124 50,126 Q65,122 80,118 Q95,113 110,110 Q125,113 140,116 Q155,122 175,126 L192,128 L192,135 L13,135 Z"
            fill="#6366f1" fill-opacity="0.15">
        <animate attributeName="d"
          values="M13,128 Q35,124 50,126 Q65,122 80,118 Q95,113 110,110 Q125,113 140,116 Q155,122 175,126 L192,128 L192,135 L13,135 Z;
                  M13,128 Q35,125 50,127 Q65,120 80,116 Q95,110 110,108 Q125,112 140,118 Q155,124 175,127 L192,128 L192,135 L13,135 Z;
                  M13,128 Q35,124 50,126 Q65,122 80,118 Q95,113 110,110 Q125,113 140,116 Q155,122 175,126 L192,128 L192,135 L13,135 Z"
          dur="4s" repeatCount="indefinite"/>
      </path>
      <!-- Peak marker dot -->
      <circle cx="110" cy="110" r="4" fill="#818cf8" filter="url(#sf3)">
        <animate attributeName="cy" values="110;108;110" dur="4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Bottom row: metadata -->
    <text x="450" y="178" font-family="'Segoe UI', system-ui, sans-serif" font-size="8.5" fill="#374151"
          text-anchor="middle" letter-spacing="1">
      UPDATED EVERY 15 MINUTES  ·  ThingSpeak IoT Ch.3424513  ·  CWC IMDPS  ·  ECMWF Open API
    </text>

    <rect width="900" height="185" rx="16" fill="none" stroke="#1e3a5f" stroke-width="1.5"/>
  </g>
</svg>
