<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="100%" height="100%">
  <!-- Definitions for Gradients, Dropshadows, and Patterns -->
  <defs>
    <!-- Background Gradient (Soft Light / Ice Blue) -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Node Gradients -->
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="secondaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    
    <linearGradient id="warningGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Soft Drop Shadow for Elements -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-opacity="0.15" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Moving Dot Path Animation -->
    <style>
      .dash-path {
        stroke-dasharray: 10, 10;
        animation: dash 3s linear infinite;
      }
      @keyframes dash {
        to {
          stroke-dashoffset: -20;
        }
      }
      .node-text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 16px;
        fill: #ffffff;
      }
      .sub-text {
        font-family: 'Inter', -apple-system, sans-serif;
        font-weight: 400;
        font-size: 12px;
        fill: #e2e8f0;
      }
      .title-text {
        font-family: 'Inter', -apple-system, sans-serif;
        font-weight: 800;
        font-size: 28px;
        fill: #0f172a;
      }
      .subtitle-text {
        font-family: 'Inter', -apple-system, sans-serif;
        font-weight: 500;
        font-size: 14px;
        fill: #475569;
        letter-spacing: 1px;
      }
      .pulse {
        animation: pulse-anim 2s infinite ease-in-out;
      }
      @keyframes pulse-anim {
        0% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.05); opacity: 1; }
        100% { transform: scale(1); opacity: 0.8; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGradient)" rx="16" ry="16" />

  <!-- Grid Pattern Overlay for Tech Feel -->
  <g opacity="0.05">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#000" stroke-width="1"/>
    </pattern>
    <rect width="100%" height="100%" fill="url(#grid)" rx="16" ry="16" />
  </g>

  <!-- Header -->
  <text x="600" y="55" class="title-text" text-anchor="middle">HYDROCAST PIPELINE ARCHITECTURE</text>
  <text x="600" y="80" class="subtitle-text" text-anchor="middle">REAL-TIME FLOOD INTELLIGENCE &amp; HYDRAULIC MODELING</text>

  <!-- Connection Lines (Data Flow) -->
  <!-- Meteo to Python -->
  <path d="M 230 200 C 300 200, 300 200, 380 200" fill="none" stroke="#3b82f6" stroke-width="4" class="dash-path" />
  <!-- Python to HMS -->
  <path d="M 580 200 C 620 200, 640 150, 680 150" fill="none" stroke="#8b5cf6" stroke-width="4" class="dash-path" />
  <!-- IoT to Python -->
  <path d="M 230 320 C 300 320, 380 260, 480 260" fill="none" stroke="#10b981" stroke-width="4" class="dash-path" />
  <!-- HMS to DB -->
  <path d="M 880 150 C 920 150, 940 200, 980 200" fill="none" stroke="#8b5cf6" stroke-width="4" class="dash-path" />
  <!-- DB to Frontend -->
  <path d="M 1030 240 L 1030 300" fill="none" stroke="#f59e0b" stroke-width="4" class="dash-path" />
  
  <!-- Back channel: Python dumping JSON directly to Frontend -->
  <path d="M 530 240 L 530 340 L 930 340" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-dasharray="5,5" opacity="0.6"/>

  <!-- BLOCK 1: ECMWF / NWP Data -->
  <g transform="translate(50, 160)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="180" height="80" rx="12" fill="url(#primaryGradient)" />
    <circle cx="20" cy="20" r="4" fill="#60a5fa" class="pulse"/>
    <text x="90" y="35" class="node-text" text-anchor="middle">Open-Meteo SDK</text>
    <text x="90" y="55" class="sub-text" text-anchor="middle">ECMWF IFS 9km HRES</text>
    <text x="90" y="70" class="sub-text" text-anchor="middle">90-Hour Forecast</text>
  </g>

  <!-- BLOCK 2: IoT Sensors -->
  <g transform="translate(50, 280)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="180" height="80" rx="12" fill="url(#secondaryGradient)" />
    <circle cx="20" cy="20" r="4" fill="#34d399" class="pulse"/>
    <text x="90" y="35" class="node-text" text-anchor="middle">ThingSpeak IoT</text>
    <text x="90" y="55" class="sub-text" text-anchor="middle">Ultrasonic Water Level</text>
    <text x="90" y="70" class="sub-text" text-anchor="middle">Shivaji Bridge Telemetry</text>
  </g>

  <!-- BLOCK 3: Python Hydrology Runner -->
  <g transform="translate(380, 160)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="200" height="80" rx="12" fill="#1e293b" />
    <circle cx="20" cy="20" r="4" fill="#facc15" class="pulse"/>
    <text x="100" y="35" class="node-text" text-anchor="middle">Python Run Engine</text>
    <text x="100" y="55" class="sub-text" text-anchor="middle">Dynamic Subbasin Selector</text>
    <text x="100" y="70" class="sub-text" text-anchor="middle">HEC-DSS PyDSS Integration</text>
  </g>

  <!-- BLOCK 4: HEC-HMS Model -->
  <g transform="translate(680, 110)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="200" height="80" rx="12" fill="url(#accentGradient)" />
    <text x="100" y="35" class="node-text" text-anchor="middle">HEC-HMS Engine</text>
    <text x="100" y="55" class="sub-text" text-anchor="middle">SCS-CN &amp; Muskingum</text>
    <text x="100" y="70" class="sub-text" text-anchor="middle">Discharge Routing</text>
  </g>

  <!-- BLOCK 5: PostgreSQL Database -->
  <g transform="translate(930, 160)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="180" height="80" rx="12" fill="url(#warningGradient)" />
    <text x="90" y="35" class="node-text" text-anchor="middle">Supabase Postgres</text>
    <text x="90" y="55" class="sub-text" text-anchor="middle">Ledger &amp; Analytics</text>
    <text x="90" y="70" class="sub-text" text-anchor="middle">Cloud Persistence</text>
  </g>

  <!-- BLOCK 6: Next.js Frontend Dashboard -->
  <g transform="translate(930, 300)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="180" height="80" rx="12" fill="#0f172a" />
    <text x="90" y="35" class="node-text" text-anchor="middle">Next.js App Router</text>
    <text x="90" y="55" class="sub-text" text-anchor="middle">React Dashboard</text>
    <text x="90" y="70" class="sub-text" text-anchor="middle">API Route Export</text>
  </g>

  <!-- Small labels for edges -->
  <g font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#64748b">
    <text x="310" y="190">NWP Precip.</text>
    <text x="310" y="295">Obs. Stage</text>
    <text x="630" y="140">Hyetographs</text>
    <text x="930" y="140">Discharge</text>
    <text x="730" y="335">JSON Pipeline Dump</text>
    <text x="1040" y="275">Fetch</text>
  </g>

  <!-- Validation loop representation -->
  <path d="M 680 180 C 600 230, 480 300, 380 300" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4" opacity="0.6"/>
  <text x="500" y="280" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#ef4444">Accuracy Evaluation</text>

  <!-- Add some techy accent lines -->
  <rect x="0" y="440" width="1200" height="10" fill="url(#primaryGradient)" />
</svg>
